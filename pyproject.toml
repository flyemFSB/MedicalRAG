[project]
name = "medicalrag"
version = "0.1.0"
description = "Evidence-first medical RAG knowledge workbench (uv workspace root)"
requires-python = ">=3.14"
dependencies = ["medicalrag-core", "medicalrag-infra", "medicalrag-api", "medicalrag-agent", "medicalrag-worker", "medicalrag-evaluation"]

[tool.uv.sources]
medicalrag-core = { workspace = true }
medicalrag-infra = { workspace = true }
medicalrag-api = { workspace = true }
medicalrag-agent = { workspace = true }
medicalrag-worker = { workspace = true }
medicalrag-evaluation = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=7.0",
  "ruff>=0.16",
  "pyright>=1.1.405",
  "pre-commit>=4.0",
  # FastAPI TestClient 需要 httpx2（starlette 1.3 起）。
  "httpx2>=0.1",
]

[tool.uv.workspace]
members = [
  "packages/*",
  "apps/api",
  "apps/agent",
  "apps/worker",
  "apps/evaluation",
]

[tool.uv]
# ADR 0065: Aliyun mirror for uv; lockfiles remain canonical.
index-url = "https://mirrors.aliyun.com/pypi/simple/"

[tool.ruff]
target-version = "py314"
line-length = 100
# ruff 0.16 默认 include 含 *.md（会格式化文档内 fenced Python 代码块）；计划文档是
# 规范工件，禁止被 lint/format 改写，一律排除。
extend-exclude = ["*.md"]

[tool.ruff.lint.isort]
known-first-party = [
  "medicalrag_core",
  "medicalrag_infra",
  "medicalrag_api",
  "medicalrag_agent",
  "medicalrag_worker",
  "medicalrag_evaluation",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  # 集成测试打此标记，仅在配置 MEDICALRAG_TEST_DATABASE_URL 时运行（ADR 0080）。
  "integration: needs real middleware (compose --profile test)",
]

[tool.pyright]
# ADR 0080：Python 类型门禁（basic 起步，逐步收紧 strict）。
include = [
  "packages/medical-core/src",
  "packages/infra/src",
  "apps/api/src",
  "apps/agent/src",
  "apps/worker/src",
  "apps/evaluation/src",
]
exclude = ["**/__pycache__", "**/node_modules", ".venv", "apps/web/dist"]
typeCheckingMode = "basic"
pythonVersion = "3.14"

[tool.coverage.report]
# ADR 0080：基线 82%（2026-08-24 全量实测），门禁设 80% 只防回退。
fail_under = 80

[tool.coverage.run]
source = [
  "packages/medical-core/src/medicalrag_core",
  "packages/infra/src/medicalrag_infra",
  "apps/api/src/medicalrag_api",
  "apps/agent/src/medicalrag_agent",
  "apps/worker/src/medicalrag_worker",
  "apps/evaluation/src/medicalrag_evaluation",
]
omit = ["*/tests/*", "*/migrations/*"]

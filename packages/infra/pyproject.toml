[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medicalrag-infra"
version = "0.1.0"
description = "MedicalRAG shared adapter package: structured logging, metrics, health, persistence, providers"
requires-python = ">=3.14"
dependencies = [
  "medicalrag-core",
  "sqlalchemy>=2.0.51",
  "asyncpg>=0.31.0",
  "aiosqlite>=0.20",
  "httpx2>=2.12",
  "argon2-cffi>=23.1",
  "redis[hiredis]>=8.1",
  "qdrant-client>=1.19",
  "fastembed>=0.8.0",
  # openai SDK 3.x 起 HTTP 层切换到 httpx2（pydantic 维护）；本包 transport 注入同源。
  "openai>=3.3",
  "tiktoken>=0.12",
  "loguru>=0.7.3",
]

[tool.uv.sources]
medicalrag-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/medicalrag_infra"]

[tool.hatch.build.targets.sdist]
include = ["src/medicalrag_infra"]

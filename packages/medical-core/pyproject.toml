[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medicalrag-core"
version = "0.1.0"
description = "MedicalRAG domain seam: entities, value objects, state machines, policies, ports, deterministic services"
requires-python = ">=3.14"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/medicalrag_core"]

[tool.hatch.build.targets.sdist]
include = ["src/medicalrag_core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "medicalrag-api"
version = "0.1.0"
description = "MedicalRAG FastAPI composition root: auth/business/admin APIs, ingestion trigger (writes outbox)"
requires-python = ">=3.14"
dependencies = [
  "medicalrag-core",
  "medicalrag-infra",
  "fastapi>=0.141",
  "uvicorn>=0.34",
  "pydantic-settings>=2.7",
  "alembic>=1.18.5",
  "email-validator>=2.2",
  "python-multipart>=0.0.20",
]

[tool.uv.sources]
medicalrag-core = { workspace = true }
medicalrag-infra = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/medicalrag_api"]

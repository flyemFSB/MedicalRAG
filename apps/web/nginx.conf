# MedicalRAG Nginx（apps/web 静态服务 + /api 与 /api/agent 同源反代，ADR 0070）。
# SSE 反代关 buffering（配合 Aegra 的 X-Accel-Buffering: no）。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退（Vite 历史模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api/agent → agent（Aegra，Agent Protocol v2 SSE）
    location /api/agent {
        proxy_pass http://agent:2026;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # /phoenix → phoenix（可选 observability profile，ADR 0082；未启用时该路径 502，fail-open）
    # Phoenix 侧 PHOENIX_HOST_ROOT_PATH=/phoenix，按同前缀服务 UI 与 /redirects 深链。
    location /phoenix/ {
        proxy_pass http://phoenix:6006;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 健康探针：前端 fetchHealth 走 /ready、运维探针 /healthz（与 Vite dev proxy 对齐）
    location = /ready {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /healthz {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # /api/chat/stream SSE：关 buffering、长读（FastAPI EventSourceResponse，ADR 0041）
    location /api/chat/stream {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # /api → api（FastAPI）
    location /api {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

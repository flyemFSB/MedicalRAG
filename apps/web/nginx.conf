# MedicalRAG Nginx（apps/web 静态服务 + /api 与 /api/agent 同源反代，ADR 0070）。
# SSE 反代关 buffering（配合 Aegra 的 X-Accel-Buffering: no）。
server {
    # 8080：nginx-unprivileged 非 root 监听端口（ADR 0080 非 root 承诺；compose 映射 8080:8080）
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 安全响应头（同源 Cookie 鉴权工具；缺 nosniff/frame 保护 = 可被任意站点嵌套后带 Cookie 发起写操作）。
    # 注意：带 add_header 的 location 会覆盖 server 级头，故下面 /assets/ 与 = /index.html 内重复声明。
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # 压缩（官方镜像自带 nginx.conf 中 gzip 为注释关闭状态）
    gzip on;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # 上传体积上限：默认 1MB 会让同源入口的大文件上传直接 413（API 侧上限 200MB，此处放宽并留余量）
    client_max_body_size 210m;

    # Docker 内嵌 DNS：phoenix 为可选服务（observability profile），其 upstream 需请求期解析而非启动期
    resolver 127.0.0.11 valid=10s ipv6=off;

    # SPA 路由回退（Vite 历史模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 哈希化构建产物：内容不变则永久缓存
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        try_files $uri =404;
    }

    # 入口 HTML 必须每次校验，否则发布后用户仍拿到旧版资源引用
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }

    # /api/agent → agent（Aegra，Agent Protocol v2 SSE）
    # 注意：proxy_pass 必须带尾斜杠”/“以剥掉 /api/agent 前缀 —— Aegra 路由在根
    # （/threads/...、/runs/stream），否则 SDK 的 runs/stream 请求被 Aegra 以 404 静默拒绝。
    location /api/agent {
        proxy_pass http://agent:2026/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # /phoenix → phoenix（可选 observability profile，ADR 0082；未启用时该路径 502，fail-open）。
    # 静态 upstream 在启动期解析，phoenix 缺席会直接 [emerg] 退出（实测）；改用变量 + resolver 惰性解析，
    # 运行时不可达才 502，与 fail-open 语义一致。
    location /phoenix/ {
        set $phoenix_upstream phoenix:6006;
        proxy_pass http://$phoenix_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # 健康探针：前端 fetchHealth 走 /ready、运维探针 /healthz（与 Vite dev proxy 对齐）
    location = /ready {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /healthz {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # /api/chat/stream SSE：关 buffering、长读（FastAPI EventSourceResponse，ADR 0041）
    location /api/chat/stream {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # /api → api（FastAPI）
    location /api {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

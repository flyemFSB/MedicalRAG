# MedicalRAG 根 docker-compose.yml —— 唯一 Compose 入口（ADR 0053 / compose-topology ticket）。
#
# docker compose up -d 默认启动全部中间件与应用服务：核心中间件（PostgreSQL/Redis/Qdrant）
# + 应用服务（api/agent/worker/web）。自托管 Phoenix（Postgres 后端）为可选 observability
# profile（ADR 0082）；集成测试中间件为可选 test profile（ADR 0080，宿主端口错开避免与默认栈冲突）。
# Qdrant 单容器部署。全部镜像钉 tag（version-baseline §5，禁 latest）；包镜像走阿里云（ADR 0065）。
#
# 生产边界：中间件端口只绑定 127.0.0.1（容器网络内服务互访，不对外暴露）；
# 数据库密码等敏感值经 .env 注入（见 .env.example），对外部署必须显式设置。

name: medicalrag

networks:
  app:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  # 对象存储本地适配器共享根：api 写入摄取原始对象，worker 消费（ADR 0075）
  objects-data:

x-default-limits: &default-limits
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 512M

# 默认 json-file driver 无上限：常驻容器必须轮转，防日志慢性吃满磁盘
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medicalrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medicalrag}
      POSTGRES_DB: ${POSTGRES_DB:-medicalrag}
      POSTGRES_INITDB_ARGS: --data-checksums --auth-host=scram-sha-256
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=256MB
      -c maintenance_work_mem=32MB
      -c max_connections=20
      -c work_mem=2MB
    ports:
      # 仅本机可达；容器间走 app 网络的服务名。
      - "127.0.0.1:5432:5432"
    volumes:
      # PG18+ 镜像官方布局：单挂载 /var/lib/postgresql，数据落在 <major>/docker 子目录
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medicalrag} -d ${POSTGRES_DB:-medicalrag}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_interval: 2s
      start_period: 5s
    networks: [app]
    restart: unless-stopped
    # fast shutdown 需要时间完成检查点，默认 10s 会被 SIGKILL
    stop_grace_period: 30s
    logging: *default-logging
    <<: *default-limits

  redis:
    image: redis:8.10-alpine
    # AOF everysec 兜底（丢至多 1s，摄取链路有 outbox/PG 补偿）；关 RDB 免双份写放大；
    # 显式 maxmemory：noeviction 下写满即 fail-fast，好过撞容器限额被 OOM-kill
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_interval: 2s
      start_period: 5s
    networks: [app]
    restart: unless-stopped
    logging: *default-logging
    <<: *default-limits

  qdrant:
    image: qdrant/qdrant:v1.19.0
    # 1 CPU 限额下限制并发搜索线程，抑制内存放大（ADR 0081）
    environment:
      QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS: "2"
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # qdrant 镜像无 curl/wget；bash /dev/tcp 探测 6333（官方推荐方式）
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_interval: 2s
      start_period: 5s
    networks: [app]
    restart: unless-stopped
    # HNSW/优化器构建期峰值超出 512M，单独放宽到 1G
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    logging: *default-logging

  # --- 一次性初始化：为 Aegra 与 Phoenix 建独立库（幂等；agent/observability 各用一库） ---

  db-init:
    image: postgres:18.4-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-medicalrag}
      PGUSER: ${POSTGRES_USER:-medicalrag}
      PGDB: ${POSTGRES_DB:-medicalrag}
    entrypoint: ["sh", "-c"]
    command:
      - >-
        psql -v ON_ERROR_STOP=1 -h postgres -U "$$PGUSER" -d "$$PGDB" -tAc "SELECT 1 FROM pg_database WHERE datname='medicalrag_aegra'" | grep -q 1
        || psql -h postgres -U "$$PGUSER" -d "$$PGDB" -c "CREATE DATABASE medicalrag_aegra";
        psql -v ON_ERROR_STOP=1 -h postgres -U "$$PGUSER" -d "$$PGDB" -tAc "SELECT 1 FROM pg_database WHERE datname='medicalrag_phoenix'" | grep -q 1
        || psql -h postgres -U "$$PGUSER" -d "$$PGDB" -c "CREATE DATABASE medicalrag_phoenix"
    networks: [app]
    restart: "no"

  # --- 应用服务（各 app 实现后补齐 Dockerfile；见 infra/ 部署资产目录职责） ---

  # 一次性迁移 Job（ADR 0080）：api 启动前把 schema 推到 head；多副本时由
  # Compose depends_on 保证先于 api 完成，避免并发迁移竞争。
  migrate:
    build:
      context: .
      dockerfile: infra/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      MEDICALRAG_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-medicalrag}:${POSTGRES_PASSWORD:-medicalrag}@postgres:5432/${POSTGRES_DB:-medicalrag}
    command: ["sh", "-c", "cd apps/api && alembic upgrade head"]
    restart: "no"
    networks: [app]

  api:
    build:
      context: .
      dockerfile: infra/api/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MEDICALRAG_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-medicalrag}:${POSTGRES_PASSWORD:-medicalrag}@postgres:5432/${POSTGRES_DB:-medicalrag}
      MEDICALRAG_REDIS_URL: redis://redis:6379/0
      MEDICALRAG_QDRANT_URL: http://qdrant:6333
      MEDICALRAG_LLM_BASE_URL: ${MEDICALRAG_LLM_BASE_URL:-https://api.openai.com}
      MEDICALRAG_LLM_API_KEY: ${MEDICALRAG_LLM_API_KEY:-}
      MEDICALRAG_LLM_MODEL: ${MEDICALRAG_LLM_MODEL:-gpt-4o-mini}
      MEDICALRAG_EMBEDDING_MODEL: ${MEDICALRAG_EMBEDDING_MODEL:-text-embedding-3-small}
      MEDICALRAG_RERANK_MODEL: ${MEDICALRAG_RERANK_MODEL:-}
      MEDICALRAG_COOKIE_SECURE: ${MEDICALRAG_COOKIE_SECURE:-false}
      MEDICALRAG_OPERATOR_EMAILS: ${MEDICALRAG_OPERATOR_EMAILS:-}
      MEDICALRAG_LOG_LEVEL: ${MEDICALRAG_LOG_LEVEL:-INFO}
      MEDICALRAG_OBJECT_ROOT: /data/objects
    volumes:
      # 对象存储本地适配器共享根：api（上传/摄取触发）与 worker 同卷同路径
      - objects-data:/data/objects
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_interval: 2s
      start_period: 10s
    networks: [app]
    logging: *default-logging
    <<: *default-limits

  agent:
    build:
      context: .
      dockerfile: infra/agent/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    # ADR 0076/0082：Aegra 唯一观测摄取 owner；export fail-open（端点不可用仅降级可观测）。
    environment:
      # aegra 独立库（与 api 的 alembic_version 迁移表隔离，避免迁移链污染）
      DATABASE_URL: postgresql://${POSTGRES_USER:-medicalrag}:${POSTGRES_PASSWORD:-medicalrag}@postgres:5432/medicalrag_aegra
      RUN_MIGRATIONS_ON_STARTUP: "true"
      MEDICALRAG_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-medicalrag}:${POSTGRES_PASSWORD:-medicalrag}@postgres:5432/${POSTGRES_DB:-medicalrag}
      MEDICALRAG_QDRANT_URL: http://qdrant:6333
      MEDICALRAG_REDIS_URL: redis://redis:6379/0
      MEDICALRAG_LLM_BASE_URL: ${MEDICALRAG_LLM_BASE_URL:-https://api.openai.com}
      MEDICALRAG_LLM_API_KEY: ${MEDICALRAG_LLM_API_KEY:-}
      MEDICALRAG_LLM_MODEL: ${MEDICALRAG_LLM_MODEL:-gpt-4o-mini}
      OTEL_TARGETS: ${OTEL_TARGETS:-}
      OTEL_SERVICE_NAME: medicalrag-agent
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
      PHOENIX_API_KEY: ${PHOENIX_API_KEY:-}
    ports:
      - "127.0.0.1:2026:2026"
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 2026), 3).close()"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_interval: 2s
      start_period: 10s
    networks: [app]
    logging: *default-logging
    <<: *default-limits

  worker:
    build:
      context: .
      dockerfile: infra/worker/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    environment:
      MEDICALRAG_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-medicalrag}:${POSTGRES_PASSWORD:-medicalrag}@postgres:5432/${POSTGRES_DB:-medicalrag}
      MEDICALRAG_REDIS_URL: redis://redis:6379/0
      MEDICALRAG_QDRANT_URL: http://qdrant:6333
      MEDICALRAG_LLM_BASE_URL: ${MEDICALRAG_LLM_BASE_URL:-https://api.openai.com}
      MEDICALRAG_LLM_API_KEY: ${MEDICALRAG_LLM_API_KEY:-}
      MEDICALRAG_EMBEDDING_MODEL: ${MEDICALRAG_EMBEDDING_MODEL:-text-embedding-3-small}
      MEDICALRAG_MINERU_BASE_URL: ${MEDICALRAG_MINERU_BASE_URL:-}
      MEDICALRAG_MINERU_TOKEN: ${MEDICALRAG_MINERU_TOKEN:-}
      MEDICALRAG_CONTEXT_MODEL: ${MEDICALRAG_CONTEXT_MODEL:-}
      MEDICALRAG_OBJECT_ROOT: /data/objects
    volumes:
      # 对象存储本地适配器：worker 与 api 必须看到同一根才能交接产物
      - objects-data:/data/objects
    networks: [app]
    logging: *default-logging
    <<: *default-limits

  web:
    # ADR 0070：Vite SPA 由 Nginx 服务并同源反代 /api 与 /api/agent（prod）。
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
      agent:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    networks: [app]
    logging: *default-logging
    <<: *default-limits

  # --- 可选可观测（ADR 0082：自托管 Phoenix（Postgres 后端，独立库 medicalrag_phoenix）；
  # 仅 --profile observability 启用，agent export fail-open） ---
  # 启用前必须在 .env 设置 PHOENIX_SECRET（签发 JWT）与 OTEL_TARGETS=PHOENIX；首启后以
  # admin@localhost 登录改密，并在 Settings 创建 system API key 回填 .env 的 PHOENIX_API_KEY
  # （aegra 导出鉴权；未设置时认证会拒收 trace，fail-open 仅降级可观测）。

  phoenix:
    image: arizephoenix/phoenix:15.1.0
    profiles: [observability]
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      PHOENIX_SQL_DATABASE_URL: postgresql://${POSTGRES_USER:-medicalrag}:${POSTGRES_PASSWORD:-medicalrag}@postgres:5432/medicalrag_phoenix
      PHOENIX_HOST_ROOT_PATH: /phoenix
      PHOENIX_ENABLE_AUTH: ${PHOENIX_ENABLE_AUTH:-true}
      PHOENIX_SECRET: ${PHOENIX_SECRET:-}
      PHOENIX_DEFAULT_RETENTION_POLICY_DAYS: ${PHOENIX_DEFAULT_RETENTION_POLICY_DAYS:-90}
      PHOENIX_ALLOW_EXTERNAL_RESOURCES: "false"
      PHOENIX_TELEMETRY_ENABLED: "false"
    ports:
      - "127.0.0.1:6006:6006"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006/', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_interval: 2s
      start_period: 15s
    logging: *default-logging
    networks: [app]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # --- 可选集成测试中间件（ADR 0080；--profile test 启用；宿主端口错开默认栈） ---

  postgres-test:
    image: postgres:18.4-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: medicalrag_test
      POSTGRES_PASSWORD: medicalrag_test
      POSTGRES_DB: medicalrag_test
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      # 测试库无需持久化：tmpfs 提速且零清理负担
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medicalrag_test -d medicalrag_test"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks: [app]

  redis-test:
    image: redis:8.10-alpine
    profiles: [test]
    ports:
      - "127.0.0.1:6380:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks: [app]

  qdrant-test:
    image: qdrant/qdrant:v1.19.0
    profiles: [test]
    ports:
      - "127.0.0.1:6335:6333"
    tmpfs:
      - /qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks: [app]

  # --- 可选集成测试中间件（ADR 0080；--profile test 启用；宿主端口错开默认栈） ---
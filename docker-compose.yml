# MedicalRAG root Compose stack (single entrypoint).
# Default: middleware (Postgres/Redis/Qdrant/RabbitMQ) + apps (migrate/api/agent/worker/web).
# Profiles: observability (self-hosted Phoenix), test (integration middleware).
# Host ports bind 127.0.0.1 only. Secrets via .env (see .env.example). Images pin tags.

name: medicalrag

networks:
  app:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  rabbitmq-data:
  # Shared object-storage root: api writes, worker consumes
  objects-data:

x-default-limits: &default-limits
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 512M

# json-file driver defaults to unbounded; rotate to avoid disk fill
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-medicalrag}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medicalrag}
      POSTGRES_DB: ${POSTGRES_DB:-medicalrag}
      POSTGRES_INITDB_ARGS: --data-checksums --auth-host=scram-sha-256
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=256MB
      -c maintenance_work_mem=32MB
      -c max_connections=20
      -c work_mem=2MB
    ports:
      # Host-local only; containers use service names on the app network
      - "127.0.0.1:5432:5432"
    volumes:
      # PG18+ image layout: single mount at /var/lib/postgresql
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medicalrag} -d ${POSTGRES_DB:-medicalrag}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_interval: 2s
      start_period: 5s
    networks: [app]
    restart: unless-stopped
    # fast shutdown needs time for checkpoints; default 10s gets SIGKILL
    stop_grace_period: 30s
    logging: *default-logging
    <<: *default-limits

  redis:
    image: redis:8.10-alpine
    # AOF everysec (≤1s loss; outbox/PG compensates); no RDB; noeviction fail-fast
    # under write pressure instead of OOM-kill at the container limit.
    # requirepass：内网 app 网络内最小纵深（被攻陷的 web 容器不可无凭据读写会话）。
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-medicalrag}
    command:
      ["redis-server", "--requirepass", "${REDIS_PASSWORD:-medicalrag}", "--appendonly", "yes", "--appendfsync", "everysec", "--save", "", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_interval: 2s
      start_period: 5s
    networks: [app]
    restart: unless-stopped
    logging: *default-logging
    <<: *default-limits

  qdrant:
    image: qdrant/qdrant:v1.19.1
    # Cap search threads under 1 CPU to limit memory amplification
    environment:
      QDRANT__STORAGE__PERFORMANCE__MAX_SEARCH_THREADS: "2"
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      # Image has no curl/wget; bash /dev/tcp probe is the recommended approach
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_interval: 2s
      start_period: 5s
    networks: [app]
    restart: unless-stopped
    # HNSW/optimize peaks exceed the 512M default limit
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    logging: *default-logging

  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    # Durable task transport for the ingestion pipeline (ADR 0086): persistent
    # publish + quorum task queue declared by taskiq-aio-pika at worker startup.
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-medicalrag}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-medicalrag}
    ports:
      # 5672 AMQP; 15672 management UI (ops debugging of queues / dead letters)
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_interval: 2s
      start_period: 20s
    networks: [app]
    restart: unless-stopped
    logging: *default-logging
    <<: *default-limits

  # One-shot: create separate DBs for Aegra and Phoenix (idempotent)
  db-init:
    image: postgres:18.4-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-medicalrag}
      PGUSER: ${POSTGRES_USER:-medicalrag}
      PGDB: ${POSTGRES_DB:-medicalrag}
    entrypoint: ["sh", "-c"]
    command:
      - >-
        psql -v ON_ERROR_STOP=1 -h postgres -U "$$PGUSER" -d "$$PGDB" -tAc "SELECT 1 FROM pg_database WHERE datname='medicalrag_aegra'" | grep -q 1
        || psql -h postgres -U "$$PGUSER" -d "$$PGDB" -c "CREATE DATABASE medicalrag_aegra";
        psql -v ON_ERROR_STOP=1 -h postgres -U "$$PGUSER" -d "$$PGDB" -tAc "SELECT 1 FROM pg_database WHERE datname='medicalrag_phoenix'" | grep -q 1
        || psql -h postgres -U "$$PGUSER" -d "$$PGDB" -c "CREATE DATABASE medicalrag_phoenix"
    networks: [app]
    restart: "no"

  # One-shot migration job: push schema to head before api starts
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      MEDICALRAG_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-medicalrag}:${POSTGRES_PASSWORD:-medicalrag}@postgres:5432/${POSTGRES_DB:-medicalrag}
    command: ["sh", "-c", "cd apps/api && alembic upgrade head"]
    restart: "no"
    networks: [app]

  api:
    # 应用容器崩溃/宿主重启后自愈（中间件已有 restart，应用服务此前为默认 no，语义不一致）
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MEDICALRAG_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-medicalrag}:${POSTGRES_PASSWORD:-medicalrag}@postgres:5432/${POSTGRES_DB:-medicalrag}
      MEDICALRAG_REDIS_URL: redis://:${REDIS_PASSWORD:-medicalrag}@redis:6379/0
      MEDICALRAG_QDRANT_URL: http://qdrant:6333
      MEDICALRAG_COOKIE_SECURE: ${MEDICALRAG_COOKIE_SECURE:-false}
      MEDICALRAG_OPERATOR_EMAILS: ${MEDICALRAG_OPERATOR_EMAILS:-}
      MEDICALRAG_LOG_LEVEL: ${MEDICALRAG_LOG_LEVEL:-INFO}
      MEDICALRAG_OBJECT_ROOT: /data/objects
    volumes:
      # Same volume and path as worker so handoff paths match
      - objects-data:/data/objects
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_interval: 2s
      start_period: 10s
    networks: [app]
    logging: *default-logging
    <<: *default-limits

  agent:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      # Aegra own database (separate from api alembic history)
      DATABASE_URL: postgresql://${POSTGRES_USER:-medicalrag}:${POSTGRES_PASSWORD:-medicalrag}@postgres:5432/medicalrag_aegra
      MEDICALRAG_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-medicalrag}:${POSTGRES_PASSWORD:-medicalrag}@postgres:5432/${POSTGRES_DB:-medicalrag}
      MEDICALRAG_QDRANT_URL: http://qdrant:6333
      MEDICALRAG_REDIS_URL: redis://:${REDIS_PASSWORD:-medicalrag}@redis:6379/0
      MEDICALRAG_LLM_BASE_URL: ${MEDICALRAG_LLM_BASE_URL:-https://api.openai.com}
      MEDICALRAG_LLM_API_KEY: ${MEDICALRAG_LLM_API_KEY:-}
      MEDICALRAG_LLM_MODEL: ${MEDICALRAG_LLM_MODEL:-gpt-4o-mini}
      MEDICALRAG_EMBEDDING_MODEL: ${MEDICALRAG_EMBEDDING_MODEL:-text-embedding-3-small}
      MEDICALRAG_RERANK_MODEL: ${MEDICALRAG_RERANK_MODEL:-}
      MEDICALRAG_QDRANT_COLLECTION: ${MEDICALRAG_QDRANT_COLLECTION:-medical_chunks_v1}
      MEDICALRAG_QDRANT_EMBEDDING_DIM: ${MEDICALRAG_QDRANT_EMBEDDING_DIM:-1536}
      # 聊天并发闸 / 检索策略：与 api 侧同一 .env 文档旋钮（图入口与 SSE 入口共享语义）
      MEDICALRAG_RETRIEVAL_POLICY_VERSION: ${MEDICALRAG_RETRIEVAL_POLICY_VERSION:-2}
      MEDICALRAG_RETRIEVAL_CONTEXT_CAP: ${MEDICALRAG_RETRIEVAL_CONTEXT_CAP:-8}
      MEDICALRAG_RETRIEVAL_EVIDENCE_MIN_SCORE: ${MEDICALRAG_RETRIEVAL_EVIDENCE_MIN_SCORE:-0}
      MEDICALRAG_RETRIEVAL_INTENT_MIN_SCORE: ${MEDICALRAG_RETRIEVAL_INTENT_MIN_SCORE:-0.35}
      MEDICALRAG_RETRIEVAL_RERANK_CANDIDATE_LIMIT: ${MEDICALRAG_RETRIEVAL_RERANK_CANDIDATE_LIMIT:-40}
      MEDICALRAG_CHAT_MAX_CONCURRENT: ${MEDICALRAG_CHAT_MAX_CONCURRENT:-10}
      MEDICALRAG_CHAT_QUEUE_WAIT_S: ${MEDICALRAG_CHAT_QUEUE_WAIT_S:-15}
      MEDICALRAG_LLM_FIRST_PACKET_TIMEOUT_S: ${MEDICALRAG_LLM_FIRST_PACKET_TIMEOUT_S:-30}
      # fastembed pulls Qdrant/bm25 sparse weights from HuggingFace Hub at startup
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      OTEL_TARGETS: ${OTEL_TARGETS:-}
      OTEL_SERVICE_NAME: medicalrag-agent
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006/v1/traces
      PHOENIX_API_KEY: ${PHOENIX_API_KEY:-}
    ports:
      - "127.0.0.1:2026:2026"
    healthcheck:
      test: ["CMD", "python3", "-c", "import socket; socket.create_connection(('127.0.0.1', 2026), 3).close()"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_interval: 2s
      start_period: 10s
    networks: [app]
    logging: *default-logging
    <<: *default-limits

  worker:
    restart: unless-stopped
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      MEDICALRAG_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-medicalrag}:${POSTGRES_PASSWORD:-medicalrag}@postgres:5432/${POSTGRES_DB:-medicalrag}
      MEDICALRAG_REDIS_URL: redis://:${REDIS_PASSWORD:-medicalrag}@redis:6379/0
      MEDICALRAG_RABBITMQ_URL: amqp://${RABBITMQ_USER:-medicalrag}:${RABBITMQ_PASSWORD:-medicalrag}@rabbitmq:5672/
      MEDICALRAG_QDRANT_URL: http://qdrant:6333
      MEDICALRAG_QDRANT_COLLECTION: ${MEDICALRAG_QDRANT_COLLECTION:-medical_chunks_v1}
      MEDICALRAG_QDRANT_EMBEDDING_DIM: ${MEDICALRAG_QDRANT_EMBEDDING_DIM:-1536}
      MEDICALRAG_LLM_BASE_URL: ${MEDICALRAG_LLM_BASE_URL:-https://api.openai.com}
      MEDICALRAG_LLM_API_KEY: ${MEDICALRAG_LLM_API_KEY:-}
      MEDICALRAG_EMBEDDING_MODEL: ${MEDICALRAG_EMBEDDING_MODEL:-text-embedding-3-small}
      MEDICALRAG_MINERU_BASE_URL: ${MEDICALRAG_MINERU_BASE_URL:-}
      MEDICALRAG_MINERU_TOKEN: ${MEDICALRAG_MINERU_TOKEN:-}
      MEDICALRAG_MINERU_CONCURRENCY: ${MEDICALRAG_MINERU_CONCURRENCY:-16}
      MEDICALRAG_CONTEXT_MODEL: ${MEDICALRAG_CONTEXT_MODEL:-}
      MEDICALRAG_STALE_RUN_SECONDS: ${MEDICALRAG_STALE_RUN_SECONDS:-900}
      MEDICALRAG_OUTBOX_MAX_ATTEMPTS: ${MEDICALRAG_OUTBOX_MAX_ATTEMPTS:-5}
      # Same as agent: fastembed sparse weights via HF mirror
      HF_ENDPOINT: ${HF_ENDPOINT:-https://hf-mirror.com}
      MEDICALRAG_OBJECT_ROOT: /data/objects
    # 心跳健康检查：worker 的 outbox relay 循环周期性写入带 TTL 的 Redis 心跳键，
    # 进程存活且循环未卡死时该键存在（worker 容器内置 python + redis 客户端）
    healthcheck:
      test: ["CMD", "python", "-c", "import os,redis; c=redis.from_url(os.environ['MEDICALRAG_REDIS_URL']); raise SystemExit(0 if c.exists('medicalrag:worker:heartbeat') else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    volumes:
      # Shared with api so both sides see the same object root
      - objects-data:/data/objects
    networks: [app]
    logging: *default-logging
    <<: *default-limits

  web:
    restart: unless-stopped
    # Vite SPA served by Nginx; same-origin reverse proxy for /api and /api/agent
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
      agent:
        condition: service_healthy
    ports:
      # nginx-unprivileged 以非 root 运行并监听 8080（ADR 0080 非 root 承诺）
      - "127.0.0.1:8080:8080"
    networks: [app]
    logging: *default-logging
    <<: *default-limits

  # Optional observability: self-hosted Phoenix (Postgres backend, DB medicalrag_phoenix).
  # Enable with --profile observability. Set PHOENIX_SECRET and OTEL_TARGETS=PHOENIX in .env.
  # After first boot: change admin password, create a system API key, set PHOENIX_API_KEY.
  phoenix:
    image: arizephoenix/phoenix:15.1.0
    profiles: [observability]
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      PHOENIX_SQL_DATABASE_URL: postgresql://${POSTGRES_USER:-medicalrag}:${POSTGRES_PASSWORD:-medicalrag}@postgres:5432/medicalrag_phoenix
      PHOENIX_HOST_ROOT_PATH: /phoenix
      PHOENIX_ENABLE_AUTH: ${PHOENIX_ENABLE_AUTH:-true}
      PHOENIX_SECRET: ${PHOENIX_SECRET:-}
      PHOENIX_DEFAULT_RETENTION_POLICY_DAYS: ${PHOENIX_DEFAULT_RETENTION_POLICY_DAYS:-90}
      PHOENIX_ALLOW_EXTERNAL_RESOURCES: "false"
      PHOENIX_TELEMETRY_ENABLED: "false"
      PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD: ${PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD:-admin}
    ports:
      - "127.0.0.1:6006:6006"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006/', timeout=3)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_interval: 2s
      start_period: 15s
    logging: *default-logging
    networks: [app]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

  # Optional integration-test middleware: --profile test; host ports offset from the default stack
  postgres-test:
    image: postgres:18.4-alpine
    profiles: [test]
    environment:
      POSTGRES_USER: medicalrag_test
      POSTGRES_PASSWORD: medicalrag_test
      POSTGRES_DB: medicalrag_test
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      # Test data does not need persistence
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medicalrag_test -d medicalrag_test"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks: [app]

  redis-test:
    image: redis:8.10-alpine
    profiles: [test]
    ports:
      - "127.0.0.1:6380:6379"
    tmpfs:
      - /data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks: [app]

  qdrant-test:
    image: qdrant/qdrant:v1.19.1
    profiles: [test]
    ports:
      - "127.0.0.1:6335:6333"
    tmpfs:
      - /qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks: [app]

  rabbitmq-test:
    image: rabbitmq:4.3-management-alpine
    profiles: [test]
    environment:
      RABBITMQ_DEFAULT_USER: medicalrag_test
      RABBITMQ_DEFAULT_PASS: medicalrag_test
    ports:
      - "127.0.0.1:5673:5672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks: [app]
